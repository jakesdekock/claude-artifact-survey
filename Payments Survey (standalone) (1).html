document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

lay: swap;\n}\n\n:root {\n  /* ---------- BRAND COLOURS ----------\n     \"There is no hierarchy here, what matters is that the colours\n      support the message... the overall layout is not too colourful.\" */\n\n  /* Primary */\n  --radius-red:    #EA0029;  /* accent ONLY: CTAs, key stats, dividers, callout panels. Never a flood fill. */\n  --slate-grey:    #101920;  /* primary text, dark panels, dark-background pages */\n\n  /* Secondary / neutrals */\n  --grey:          #76787b;  /* secondary text, captions, sub-labels */\n  --stroke-grey:   #d9d9d9;  /* rules, dividers, table borders */\n  --accent-grey:   #f7f7f8;  /* light section backgrounds, panel fills */\n  --white:         #ffffff;  /* primary background; text on Slate/Red */\n\n  /* Red interaction states (derived; keep hue, shift L) */\n  --radius-red-hover:  #c70023;\n  --radius-red-press:  #a8001d;\n\n  /* ---------- SEMANTIC COLOUR ROLES ---------- */\n  --bg:            var(--white);\n  --bg-subtle:     var(--accent-grey);\n  --bg-dark:       var(--slate-grey);\n  --fg:            var(--slate-grey);   /* default text on light */\n  --fg-on-dark:    var(--white);        /* text on slate / red */\n  --fg-muted:      var(--grey);         /* secondary copy, captions */\n  --border:        var(--stroke-grey);\n  --accent:        var(--radius-red);\n\n  /* ---------- NETWORK / PLATFORM BRAND COLOURS ----------\n     For dual-branded lockups only (UK Fuels, DCI, EDC networks; Kinesis platform).\n     NEVER used as Radius accent colours or in icons. */\n  --network-blue:  #089dd2;\n  --network-grey:  #72757c;\n  --network-navy:  #0575a8;\n  --network-green: #80bd42;\n  --kinesis-blue:  #00a7e1;\n  --velos-blue:    #233f94;  /* Velos Mastercard charge product */\n\n  /* ---------- TYPE FAMILIES ---------- */\n  --font-brand: 'Manrope', Tahoma, 'Segoe UI', sans-serif;\n  --font-fallback: Tahoma, 'Segoe UI', sans-serif;\n\n  /* ---------- TYPE WEIGHTS ---------- */\n  --w-light:    300;  /* @kind font */\n : 22mm;\n  --grid-cols: 6;        /* @kind other */\n  --grid-gutter: 5mm;    /* @kind spacing */\n\n  /* ---------- RADII ----------\n     Radius keeps corners crisp. Soft, restrained rounding only. */\n  --radius-none: 0;\n  --radius-sm: 4px;\n  --radius-md: 8px;\n  --radius-lg: 14px;\n  --radius-pill: 999px;\n\n  /* ---------- ELEVATION ----------\n     Flat-first. Shadows are subtle and cool-grey, never heavy. */\n  --shadow-sm: 0 1px 2px rgba(16, 25, 32, 0.06);\n  --shadow-md: 0 4px 16px rgba(16, 25, 32, 0.08);\n  --shadow-lg: 0 12px 36px rgba(16, 25, 32, 0.10);\n\n  /* ---------- MOTION ----------\n     Calm, forward, confident. No bounce. */\n  --ease: cubic-bezier(0.4, 0, 0.2, 1);  /* @kind other */\n  --dur-fast: 140ms;  /* @kind other */\n  --dur: 220ms;       /* @kind other */\n  --dur-slow: 360ms;  /* @kind other */\n}\n\n/* ============================================================\n   SEMANTIC ELEMENT STYLES\n   ============================================================ */\n.radius-type, .radius-type * { box-sizing: border-box; }\n\n.radius-type {\n  font-family: var(--font-brand);\n  color: var(--fg);\n  font-weight: var(--w-light);\n  font-size: var(--fs-body);\n  line-height: var(--lh-body);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n.t-cover {\n  font-weight: var(--w-semibold);\n  font-size: var(--fs-cover);\n  line-height: var(--lh-cover);\n  letter-spacing: var(--tracking-tight);\n  text-wrap: balance;\n}\n.t-h1 {\n  font-weight: var(--w-semibold);\n  font-size: var(--fs-h1);\n  line-height: var(--lh-h1);\n  letter-spacing: var(--tracking-tight);\n  text-wrap: balance;\n}\n.t-h2 {\n  font-weight: var(--w-semibold);\n  font-size: var(--fs-h2);\n  line-height: var(--lh-h2);\n}\n.t-lead {\n  font-weight: var(--w-light);\n  font-size: var(--fs-lead);\n  line-height: 1.5;\n}\n.t-body {\n  font-weight: var(--w-light);\n  font-size: var(--fs-body);\n  line-height: var(--lh-body);\n  text-wrap: pretty;\n}\n.t-eyebrow {\n  font-weight: var(--w-semibold);\n  font-size: var(--fs-strapline);\n  letter-spacing: var(--tracking-caps);\n  color: var(--accent);\n}\n.t-caption {\n  font-weight: var(--w-light);\n  font-size: var(--fs-caption);\n  line-height: var(--lh-caption);\n  color: var(--fg-muted);\n}\n.t-strapline {\n  font-weight: var(--w-light);\n  font-size: var(--fs-strapline);\n  letter-spacing: 0.01em;\n}\n\n/* Red is an accent. This helper keeps that discipline explicit. */\n.accent { color: var(--accent); }\n.on-dark { color: var(--fg-on-dark); }\n.muted { color: var(--fg-muted); }\n<\u002Fstyle>\n  <style>/* Brochure UI kit — A4 page system + components.\n   Pairs with ../../colors_and_type.css (tokens). */\n\n.bro-stage {\n  background: #e9eaec;\n  min-height: 100vh;\n  padding: 40px 0 64px;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 28px;\n  font-family: var(--font-brand);\n}\n\n/* A4 portrait sheet at 96dpi: 210×297mm = 794×1123px */\n.page {\n  width: 794px;\n  height: 1123px;\n  background: #fff;\n  position: relative;\n  box-shadow: 0 10px 40px rgba(16,25,32,.16);\n  overflow: hidden;\n  color: var(--slate-grey);\n  flex: none;\n}\n/* content margins: 18mm L/R (68px), 20mm top (76px), 22mm bottom (83px) */\n.page-pad { position:absolute; inset:0; padding: 76px 68px 83px; display:flex; flex-direction:column; }\n.page-dark { background: var(--slate-grey); color:#fff; }\n\n/* type helpers scoped to kit */\n.bro-eyebrow { font-size:14px; font-weight:600; letter-spacing:.04em; color:var(--radius-red); }\n.bro-eyebrow.on-dark { color:#fff; }\n.bro-cover-h { font-size:52px; line-height:1.05; font-weight:600; letter-spacing:-.02em; text-wrap:balance; }\n.bro-h1 { font-size:34px; line-height:1.12; font-weight:600; letter-spacing:-.02em; text-wrap:balance; margin:0; }\n.bro-h2 { font-size:20px; line-height:1.25; font-weight:600; margin:0; }\n.bro-lead { font-size:17px; line-height:1.5; font-weight:300; color:var(--slate-grey); }\n.page (\"133e89cc-1518-4932-adc1-0a3fad35b486\") format('truetype');\n  font-weight: 800;\n  font-style: normal;\n  font-display: swap;\n}\n\n:root {\n  /* ---------- BRAND COLOURS ----------\n     \"There is no hierarchy here, what matters is that the colours\n      support the message... the overall layout is not too colourful.\" */\n\n  /* Primary */\n  --radius-red:    #EA0029;  /* accent ONLY: CTAs, key stats, dividers, callout panels. Never a flood fill. */\n  --slate-grey:    #101920;  /* primary text, dark panels, dark-background pages */\n\n  /* Secondary / neutrals */\n  --grey:          #76787b;  /* secondary text, captions, sub-labels */\n  --stroke-grey:   #d9d9d9;  /* rules, dividers, table borders */\n  --accent-grey:   #f7f7f8;  /* light section backgrounds, panel fills */\n  --white:         #ffffff;  /* primary background; text on Slate/Red */\n\n  /* Red interaction states (derived; keep hue, shift L) */\n  --radius-red-hover:  #c70023;\n  --radius-red-press:  #a8001d;\n\n  /* ---------- SEMANTIC COLOUR ROLES ---------- */\n  --bg:            var(--white);\n  --bg-subtle:     var(--accent-grey);\n  --bg-dark:       var(--slate-grey);\n  --fg:            var(--slate-grey);   /* default text on light */\n  --fg-on-dark:    var(--white);        /* text on slate / red */\n  --fg-muted:      var(--grey);         /* secondary copy, captions */\n  --border:        var(--stroke-grey);\n  --accent:        var(--radius-red);\n\n  /* ---------- NETWORK / PLATFORM BRAND COLOURS ----------\n     For dual-branded lockups only (UK Fuels, DCI, EDC networks; Kinesis platform).\n     NEVER used as Radius accent colours or in icons. */\n  --network-blue:  #089dd2;\n  --network-grey:  #72757c;\n  --network-navy:  #0575a8;\n  --network-green: #80bd42;\n  --kinesis-blue:  #00a7e1;\n  --velos-blue:    #233f94;  /* Velos Mastercard charge product */\n\n  /* ---------- TYPE FAMILIES ---------- */\n  --font-brand: 'Manrope', Tahoma, 'Segoe UI', sans-serif;\n  --font-fallback: Tahoma, 'Segoe UI', sans-serif;\n\n  /* ---------- TYPE WEIGHTS ---------- */\n  --w-light:    300;  /* @kind font */\n  --w-regular:  400;  /* @kind font */\n  --w-medium:   500;  /* @kind font */\n  --w-semibold: 600;  /* @kind font */\n  --w-bold:     700;  /* @kind font */\n  --w-extrabold:800;  /* @kind font */\n\n  /* ---------- TYPE SCALE ----------\n     Print spec in pt; web equivalents at 1pt ≈ 1.333px.\n     Use the rem values for screen, the --pt-* notes for print/PDF. */\n  --fs-cover:    3.667rem; /* 44pt cover headline  | leading 48pt @kind font */\n  --fs-h1:       2.167rem; /* 26pt section heading | leading 30pt @kind font */\n  --fs-h2:       1.333rem; /* 16pt subheading      | leading 20pt @kind font */\n  --fs-body:     0.875rem; /* 10.5pt body          | leading 15pt @kind font */\n  --fs-lead:     1.083rem; /* 13pt lead paragraph @kind font */\n  --fs-caption:  0.667rem; /* 8pt caption/footnote | leading 11pt @kind font */\n  --fs-strapline:0.75rem;  /* 9pt strapline @kind font */\n\n  /* line-heights (unitless, tuned to the print leading ratios) */\n  --lh-cover:   1.09;  /* @kind font */\n  --lh-h1:      1.15;  /* @kind font */\n  --lh-h2:      1.25;  /* @kind font */\n  --lh-body:    1.43;  /* @kind font */\n  --lh-caption: 1.38;  /* @kind font */\n\n  --tracking-tight: -0.02em;  /* large display @kind font */\n  --tracking-normal: 0;       /* @kind font */\n  --tracking-caps:   0.04em;  /* eyebrows / labels (still sentence case) @kind font */\n\n  /* ---------- SPACING — 6mm baseline rhythm ----------\n     Page spacing in multiples of the 6mm baseline unit. */\n  --space-baseline: 6mm;\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 24px;\n  --space-6: 32px;\n  --space-7: 48px;\n  --space-8: 64px;\n  --space-9: 96px;\n\n  /* ---------- A4 PAGE & GRID (print) ---------- */\n  --page-w: 210mm;  /* @kind spacing */\n  --page-h: 297mm;  /* @kind spacing */\n  --bleed: 3mm;     /* @kind spacing */\n  --safe: 5mm;      /* @kind spacing */\n  --margin-x: 18mm;   /* left / right */\n  --margin-top: 20mm;\n  --margin-bottom: 22mm;\n  --grid-cols: 6;        /* @kind other */\n  --grid-gutter: 5mm;    /* @kind spacing */\n\n  /* ---------- RADII ----------\n     Radius keeps corners crisp. Soft, restrained rounding only. */\n  --radius-none: 0;\n  --radius-sm: 4px;\n  --radius-md: 8px;\n  --radius-lg: 14px;\n  --radius-pill: 999px;\n\n  /* ---------- ELEVATION ----------\n     Flat-first. Shadows are subtle and cool-grey, never heavy. */\n  --shadow-sm: 0 1px 2px rgba(16, 25, 32, 0.06);\n  --shadow-md: 0 4px 16px rgba(16, 25, 32, 0.08);\n  --shadow-lg: 0 12px 36px rgba(16, 25, 32, 0.10);\n\n  /* ---------- MOTION ----------\n     Calm, forward, confident. No bounce. */\n  --ease: cubic-bezier(0.4, 0, 0.2, 1);  /* @kind other */\n  --dur-fast: 140ms;  /* @kind other */\n  --dur: 220ms;       /* @kind other */\n  --dur-slow: 360ms;  /* @kind other */\n}\n\n/* ============================================================\n   SEMANTIC ELEMENT STYLES\n   ============================================================ */\n.radius-type, .radius-type * { box-sizing: border-box; }\n\n.radius-type {\n  font-family: var(--font-brand);\n  color: var(--fg);\n  font-weight: var(--w-light);\n  font-size: var(--fs-body);\n  line-height: var(--lh-body);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n.t-cover {\n  font-weight: var(--w-semibold);\n  font-size: var(--fs-cover);\n  line-height: var(--lh-cover);\n  letter-spacing: var(--tracking-tight);\n  text-wrap: balance;\n}\n.t-h1 {\n  font-weight: var(--w-semibold);\n  font-size: var(--fs-h1);\n  line-height: var(--lh-h1);\n  letter-spacing: var(--tracking-tight);\n  text-wrap: balance;\n}\n.t-h2 {\n  font-weight: var(--w-semibold);\n  font-size: var(--fs-h2);\n  line-height: var(--lh-h2);\n}\n.t-lead {\n  font-weight: var(--w-light);\n  font-size: var(--fs-lead);\n  line-height: 1.5;\n}\n.t-body {\n  font-weight: var(--w-light);\n  font-size: var(--fs-body);\n  line-height: var(--lh-body);\n  text-wrap: pretty;\n}\n.t-eyebrow {\n  font-weight: var(--w-semibold);\n  font-size: var(--fs-strapline);\n  letter-spacing: var(--tracking-caps);\n  color: var(--accent);\n}\n.t-caption {\n  font-weight: var(--w-light);\n  font-size: var(--fs-caption);\n  line-height: var(--lh-caption);\n  color: var(--fg-muted);\n}\n.t-strapline {\n  font-weight: var(--w-light);\n  font-size: var(--fs-strapline);\n  letter-spacing: 0.01em;\n}\n\n/* Red is an accent. This helper keeps that discipline explicit. */\n.accent { color: var(--accent); }\n.on-dark { color: var(--fg-on-dark); }\n.muted { color: var(--fg-muted); }\n\n/* Brochure UI kit — A4 page system + components.\n   Pairs with ../../colors_and_type.css (tokens). */\n\n.bro-stage {\n  background: #e9eaec;\n  min-height: 100vh;\n  padding: 40px 0 64px;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 28px;\n  font-family: var(--font-brand);\n}\n\n/* A4 portrait sheet at 96dpi: 210×297mm = 794×1123px */\n.page {\n  width: 794px;\n  height: 1123px;\n  background: #fff;\n  position: relative;\n  box-shadow: 0 10px 40px rgba(16,25,32,.16);\n  overflow: hidden;\n  color: var(--slate-grey);\n  flex: none;\n}\n/* content margins: 18mm L/R (68px), 20mm top (76px), 22mm bottom (83px) */\n.page-pad { position:absolute; inset:0; padding: 76px 68px 83px; display:flex; flex-direction:column; }\n.page-dark { background: var(--slate-grey); color:#fff; }\n\n/* type helpers scoped to kit */\n.bro-eyebrow { font-size:14px; font-weight:600; letter-spacing:.04em; color:var(--radius-red); }\n.bro-eyebrow.on-dark { color:#fff; }\n.bro-cover-h { font-size:52px; line-height:1.05; font-weight:600; letter-spacing:-.02em; text-wrap:balance; }\n.bro-h1 { font-size:34px; line-height:1.12; font-weight:600; letter-spacing:-.02em; text-wrap:balance; margin:0; }\n.bro-h2 { font-size:20px; line-height:1.25; font-weight:600; margin:0; }\n.bro-lead { font-size:17px; line-height:1.5; font-weight:300; color:var(--slate-grey); }\n.page-dark .bro-lead { color:rgba(255,255,255,.86); }\n.bro-body { font-size:14px; line-height:1.55; font-weight:300; }\n.bro-body.muted { color:var(--grey); }\n.page-dark .bro-body { color:rgba(255,255,255,.82); }\n.bro-cap { font-size:11px; line-height:1.4; font-weight:300; color:var(--grey); }\n\n.red-rule { height:3px; width:56px; background:var(--radius-red); border-radius:2px; border:0; }\n.hair { height:1px; background:var(--stroke-grey); border:0; width:100%; }\n.page-dark .hair { background:rgba(255,255,255,.16); }\n\n/* logo */\n.bro-logo { height:30px; width:auto; display:block; }\n\n/* button */\n.bro-btn { font-family:var(--font-brand); font-weight:600; font-size:15px; border-radius:8px; padding:13px 26px; border:1px solid transparent; cursor:pointer; display:inline-flex; align-items:center; gap:9px; text-decoration:none; white-space:nowrap; transition:background var(--dur) var(--ease); }\n.bro-btn svg { width:17px; height:17px; }\n.bro-btn-primary { background:var(--radius-red); color:#fff; }\n.bro-btn-primary:hover { background:var(--radius-red-hover); }\n.bro-btn-ghost { background:transparent; color:#fff; border-color:rgba(255,255,255,.35); }\n.bro-btn-ghost:hover { background:rgba(255,255,255,.08); }\n\n/* photo placeholder — encodes the photography rule */\n.photo { background:var(--accent-grey); position:relative; overflow:hidden; display:flex; align-items:flex-end; }\n.photo .ph-inner { padding:16px 18px; display:flex; align-items:center; gap:10px; color:var(--grey); }\n.photo svg { width:22px; height:22px; flex:none; }\n.photo .ph-t { font-size:11.5px; font-weight:300; line-height:1.35; }\n.photo.on-slate { background:#1b2730; }\n.photo.on-slate .ph-inner { color:rgba(255,255,255,.6); }\n\n/* stat */\n.stat-num { font-size:46px; font-weight:700; letter-spacing:-.02em; line-height:1; }\n.stat-num .u { color:var(--radius-red); }\n.stat-lbl { font-size:13px; font-weight:300; color:var(--grey); margin-top:8px; line-height:1.4; }\n.page-dark .stat-lbl { color:rgba(255,255,255,.7); }\n\n/* benefit row */\n.benefit { display:flex; gap:16px; align-items:flex-start; }\n.benefit .ico { width:42px; height:42px; border:1px solid var(--stroke-grey); border-radius:10px; display:flex; align-items:center; justify-content:center; flex:none; color:var(--slate-grey); }\n.benefit .ico svg { width:21px; height:21px; }\n.benefit h4 { margin:0 0 5px; font-size:16px; font-weight:600; }\n.benefit p { margin:0; font-size:13px; font-weight:300; line-height:1.5; color:var(--grey); }\n\n/* footer */\n.page-footer { margin-top:auto; display:flex; align-items:center; justify-content:space-between; }\n.page-footer .pf-strap { font-size:11px; font-weight:300; letter-spacing:.01em; color:var(--grey); }\n.page-dark .page-footer .pf-strap { color:rgba(255,255,255,.6); }\n.page-footer .pf-num { font-size:11px; font-weight:600; color:var(--grey); }\n.page-dark .page-footer .pf-num { color:rgba(255,255,255,.6); }\n\n/* numbered step */\n.step { display:flex; gap:16px; align-items:flex-start; }\n.step .n { width:34px; height:34px; border-radius:50%; background:var(--radius-red); color:#fff; font-weight:700; font-size:15px; display:flex; align-items:center; justify-content:center; flex:none; }\n.step h4 { margin:0 0 4px; font-size:16px; font-weight:600; }\n.step p { margin:0; font-size:13px; font-weight:300; line-height:1.5; color:var(--grey); }\n\n/* included list */\n.incl { list-style:none; margin:0; padding:0; display:grid; grid-template-columns:1fr 1fr; gap:12px 22px; }\n.incl li { display:flex; gap:10px; align-items:flex-start; font-size:13.5px; font-weight:300; line-height:1.4; }\n.incl li svg { width:18px; height:18px; color:var(--radius-red); flex:none; margin-top:1px; }\n\n/* contact line */\n.contact-row { display:flex; align-items:center; gap:12px; font-size:16px; font-weight:300; }\n.contact-row svg { width:20px; height:20px; color:var(--radius-red); flex:none; }\n.contact-row b { font-weight:600; }\n\n<\u002Fstyle>\n  <script src=\"2d09cab8-c7e9-43c3-95f0-df8d25c40730\"><\u002Fscript>\n  <style>\n    html, body { margin: 0; padding: 0; background: #f7f7f8; }\n    a { color: #101920; text-decoration: underline; text-underline-offset: 2px; }\n    a:hover { color: #EA0029; }\n    input::placeholder { color: #9a9da1; }\n    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }\n  <\u002Fstyle>\n<\u002Fhelmet>\n<div class=\"radius-type\" data-screen-label=\"Payments survey\" style=\"min-height: 100vh; box-sizing: border-box; display: flex; justify-content: center; padding: 40px 20px 64px; font-family: var(--font-brand); color: #101920; font-size: 16px; line-height: 1.5;\">\n  <div style=\"width: 100%; max-width: 680px; display: flex; flex-direction: column; gap: 24px;\">\n\n    <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 36px;\">\n      <img src=\"dbb12dc7-0555-4cd8-965d-8385db77be76\" alt=\"Radius\" style=\"height: 30px; width: auto; display: block;\">\n      <sc-if value=\"{{ inFlow }}\">\n        <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: #76787b;\">Question {{ stepNumber }} of {{ stepTotal }}<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ inFlow }}\">\n      <div style=\"height: 4px; border-radius: 2px; background: #d9d9d9; overflow: hidden;\">\n        <div style=\"height: 100%; border-radius: 2px; background: #EA0029; width: {{ progressPct }}%; transition: width 360ms cubic-bezier(0.4, 0, 0.2, 1);\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ loadError }}\">\n      <div style=\"padding: 16px 20px; border: 1px solid #d9d9d9; border-radius: 8px; background: #fff; font-weight: 300;\">{{ loadError }}<\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isIntro }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display: flex; flex-direction: column; align-items: center; text-align: center; gap: 20px; padding: 64px 0 24px; animation: rise 360ms cubic-bezier(0.4, 0, 0.2, 1) both;\">\n        <h1 style=\"margin: 0; font-size: clamp(32px, 6vw, 44px); line-height: 1.09; font-weight: 600; letter-spacing: -0.02em; text-wrap: balance; max-width: 560px;\">Could Radius support your payments?<\u002Fh1>\n        <p style=\"margin: 0; font-size: 18px; line-height: 1.5; font-weight: 300; color: #3d4248; max-width: 520px; text-wrap: pretty;\">We're exploring whether Radius could help you pay less to take card payments. Tell us a little about how you take payments today.<\u002Fp>\n        <p style=\"margin: 0; font-size: 17px; line-height: 1.5; font-weight: 600; max-width: 520px; text-wrap: balance;\">Answer six quick questions. The first 200 people to respond get a £10 Amazon gift card as a thank you.<\u002Fp>\n        <div style=\"display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: 12px;\">\n          <x-import component-from-global-scope=\"RadiusDesignSystem_712729.Button\" variant=\"primary\" on-click=\"{{ start }}\" dc-props=\"{{ startProps }}\" hint-size=\"190px,56px\">Start survey<\u002Fx-import>\n          <div style=\"font-size: 14px; font-weight: 300; color: #76787b;\">Takes approximately 60 seconds<\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin: 20px 0 0; font-size: 12px; line-height: 1.5; font-weight: 300; color: #76787b; max-width: 420px;\">One gift card per business, for the first 200 responses. Your answers stay with Radius unless you ask for a call about card payments. Terms apply.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isQuestion }}\">\n      <div style=\"display: flex; flex-direction: column; gap: 24px; padding-top: 40px; animation: rise 280ms cubic-bezier(0.4, 0, 0.2, 1) both;\">\n        <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n          <h2 style=\"margin: 0; font-size: clamp(24px, 4.5vw, 32px); line-height: 1.15; font-weight: 600; letter-spacing: -0.02em; text-wrap: balance;\">{{ title }}<\u002Fh2>\n          <sc-if value=\"{{ subtitle }}\">\n            <p style=\"margin: 0; font-size: 15px; font-weight: 300; color: #76787b;\">{{ subtitle }}<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ isList }}\">\n          <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n            <sc-for list=\"{{ options }}\" as=\"opt\" hint-placeholder-count=\"3\">\n              <button type=\"button\" sc-camel-on-click=\"{{ opt.select }}\" aria-pressed=\"{{ opt.selected }}\" style=\"display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 17px 22px; border-radius: 999px; border: 1.5px solid {{ opt.border }}; background: {{ opt.bg }}; cursor: pointer; font-family: inherit; font-size: 16px; font-weight: 500; line-height: 1.35; color: #101920; transition: border-color 140ms cubic-bezier(0.4, 0, 0.2, 1), background 140ms cubic-bezier(0.4, 0, 0.2, 1);\" style-hover=\"border-color: {{ opt.hoverBorder }};\">\n                <span style=\"width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid {{ opt.dotBorder }}; background: {{ opt.dotBg }}; display: inline-flex; align-items: center; justify-content: center; flex: none; box-sizing: border-box; transition: background 140ms cubic-bezier(0.4, 0, 0.2, 1), border-color 140ms cubic-bezier(0.4, 0, 0.2, 1);\">\n                  <sc-if value=\"{{ opt.selected }}\">\n                    <svg width=\"11\" height=\"9\" sc-camel-view-box=\"0 0 11 9\" fill=\"none\" aria-hidden=\"true\"><path d=\"M1 4.5 4 7.5 10 1.5\" stroke=\"#fff\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fsc-if>\n                <\u002Fspan>\n                <span>{{ opt.label }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isGrid }}\">\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px;\">\n            <sc-for list=\"{{ options }}\" as=\"opt\" hint-placeholder-count=\"6\">\n              <button type=\"button\" sc-camel-on-click=\"{{ opt.select }}\" aria-pressed=\"{{ opt.selected }}\" style=\"padding: 15px 18px; border-radius: 999px; border: 1.5px solid {{ opt.border }}; background: {{ opt.bg }}; cursor: pointer; font-family: inherit; font-size: 15px; font-weight: 500; color: #101920; text-align: center; transition: border-color 140ms cubic-bezier(0.4, 0, 0.2, 1), background 140ms cubic-bezier(0.4, 0, 0.2, 1);\" style-hover=\"border-color: {{ opt.hoverBorder }};\">{{ opt.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showConsent }}\">\n          <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n            <button type=\"button\" role=\"checkbox\" aria-checked=\"{{ consentGiven }}\" sc-camel-on-click=\"{{ toggleConsent }}\" style=\"display: flex; align-items: flex-start; gap: 14px; width: 100%; text-align: left; padding: 18px 22px; border-radius: 12px; border: 1.5px solid {{ consentBorder }}; background: {{ consentBg }}; cursor: pointer; font-family: inherit; font-size: 15px; font-weight: 400; line-height: 1.45; color: #101920; transition: border-color 140ms cubic-bezier(0.4, 0, 0.2, 1), background 140ms cubic-bezier(0.4, 0, 0.2, 1);\" style-hover=\"border-color: {{ consentHoverBorder }};\">\n              <span style=\"width: 22px; height: 22px; border-radius: 5px; border: 1.5px solid {{ consentBoxBorder }}; background: {{ consentBoxBg }}; display: inline-flex; align-items: center; justify-content: center; flex: none; box-sizing: border-box; margin-top: 1px; transition: background 140ms cubic-bezier(0.4, 0, 0.2, 1), border-color 140ms cubic-bezier(0.4, 0, 0.2, 1);\">\n                <sc-if value=\"{{ consentGiven }}\">\n                  <svg width=\"12\" height=\"10\" sc-camel-view-box=\"0 0 11 9\" fill=\"none\" aria-hidden=\"true\"><path d=\"M1 4.5 4 7.5 10 1.5\" stroke=\"#fff\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n                <\u002Fsc-if>\n              <\u002Fspan>\n              <span>{{ consentLabel }}<\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ consentNeeded }}\">\n              <div style=\"font-size: 13px; font-weight: 300; color: #76787b;\">Tick the box to continue, or choose No.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showFollowUp }}\">\n          <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n            <label for=\"follow-up\" style=\"font-size: 14px; font-weight: 600;\">{{ followUpLabel }} <span style=\"font-weight: 300; color: #76787b;\">({{ followUpHint }})<\u002Fspan><\u002Flabel>\n            <input id=\"follow-up\" type=\"text\" value=\"{{ followUpValue }}\" sc-camel-on-change=\"{{ onFollowUp }}\" placeholder=\"{{ followUpPlaceholder }}\" style=\"width: 100%; box-sizing: border-box; padding: 16px 22px; border-radius: 999px; border: 1.5px solid #d9d9d9; background: #fff; font-family: inherit; font-size: 16px; font-weight: 400; color: #101920; outline: none;\" style-focus=\"border-color: #101920;\">\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isEmail }}\">\n      <div style=\"display: flex; flex-direction: column; gap: 24px; padding-top: 40px; animation: rise 280ms cubic-bezier(0.4, 0, 0.2, 1) both;\">\n        <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n          <h2 style=\"margin: 0; font-size: clamp(24px, 4.5vw, 32px); line-height: 1.15; font-weight: 600; letter-spacing: -0.02em;\">You're almost done<\u002Fh2>\n          <p style=\"margin: 0; font-size: 17px; font-weight: 300; color: #3d4248;\">If you're one of the first 200 to respond, we'll send your £10 Amazon gift card to this address.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n          <label for=\"email\" style=\"font-size: 14px; font-weight: 600;\">Email address<\u002Flabel>\n          <input id=\"email\" type=\"email\" autocomplete=\"email\" value=\"{{ email }}\" sc-camel-on-change=\"{{ onEmail }}\" sc-camel-on-blur=\"{{ onEmailBlur }}\" placeholder=\"you@company.com\" style=\"width: 100%; box-sizing: border-box; padding: 16px 22px; border-radius: 999px; border: 1.5px solid {{ emailBorder }}; background: #fff; font-family: inherit; font-size: 16px; font-weight: 400; color: #101920; outline: none;\" style-focus=\"border-color: #101920;\">\n          <sc-if value=\"{{ emailError }}\">\n            <div style=\"font-size: 13px; font-weight: 500; color: #EA0029;\">{{ emailError }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <p style=\"margin: 0; font-size: 12px; line-height: 1.5; font-weight: 300; color: #76787b; text-wrap: pretty;\">Radius will use your email address to run this survey and send gift cards. We'll only share your details with our payments partner, Lopay, if you ask for a call on the next step. Read the <a href=\"https://www.radius.com/en-gb/privacy-policy/\" target=\"_blank\" rel=\"noopener\">Radius privacy policy<\u002Fa>.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isDone }}\">\n      <div style=\"display: flex; flex-direction: column; gap: 20px; padding-top: 64px; animation: rise 360ms cubic-bezier(0.4, 0, 0.2, 1) both;\">\n        <div style=\"width: 48px; height: 48px; border-radius: 50%; background: #EA0029; display: flex; align-items: center; justify-content: center;\">\n          <svg width=\"22\" height=\"18\" sc-camel-view-box=\"0 0 11 9\" fill=\"none\" aria-hidden=\"true\"><path d=\"M1 4.5 4 7.5 10 1.5\" stroke=\"#fff\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <h2 style=\"margin: 0; font-size: clamp(28px, 5vw, 36px); line-height: 1.12; font-weight: 600; letter-spacing: -0.02em;\">Thank you<\u002Fh2>\n        <p style=\"margin: 0; font-size: 17px; font-weight: 300; color: #3d4248; max-width: 520px; text-wrap: pretty;\">We've received your answers. If you're one of the first 200 to respond, we'll email your £10 Amazon gift card to <strong style=\"font-weight: 600; color: #101920;\">{{ doneEmail }}<\u002Fstrong>.<\u002Fp>\n        <sc-if value=\"{{ wantsContact }}\">\n          <p style=\"margin: 0; font-size: 17px; font-weight: 300; color: #3d4248; max-width: 520px;\">Our payments partner, Lopay, will be in touch about card payments.<\u002Fp>\n        <\u002Fsc-if>\n        <div style=\"margin-top: 24px; padding-top: 20px; border-top: 1px solid #d9d9d9; font-size: 13px; font-weight: 300; color: #76787b;\">Driving business forward<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showNav }}\">\n      <div style=\"display: flex; flex-direction: column; gap: 14px; margin-top: 16px;\">\n        <sc-if value=\"{{ submitError }}\">\n          <div style=\"padding: 14px 20px; border-radius: 8px; border: 1px solid #EA0029; background: #fff; font-size: 14px; font-weight: 400;\">{{ submitError }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display: flex; align-items: center; gap: 14px; padding-top: 24px; border-top: 1px solid #d9d9d9;\">\n          <x-import component-from-global-scope=\"RadiusDesignSystem_712729.Button\" variant=\"secondary\" on-click=\"{{ back }}\" disabled=\"{{ sending }}\" dc-props=\"{{ backProps }}\" hint-size=\"96px,52px\">Back<\u002Fx-import>\n          <div style=\"flex: 1; min-width: 0;\">\n            <x-import component-from-global-scope=\"RadiusDesignSystem_712729.Button\" variant=\"dark\" on-click=\"{{ next }}\" disabled=\"{{ nextDisabled }}\" dc-props=\"{{ nextProps }}\" hint-size=\"100%,52px\">{{ nextLabel }}<\u002Fx-import>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;endpoint&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Responses&quot;, &quot;description&quot;: &quot;Where completed surveys are POSTed as JSON (Formspree, Power Automate HTTP trigger, Google Apps Script web app). Leave empty to only keep responses in this browser.&quot; },\n  &quot;endpointMode&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;json&quot;, &quot;options&quot;: [&quot;json&quot;, &quot;no-cors&quot;], &quot;tsType&quot;: &quot;'json' | 'no-cors'&quot;, &quot;section&quot;: &quot;Responses&quot;, &quot;description&quot;: &quot;json for Formspree / Power Automate. no-cors for Google Apps Script web apps (no delivery confirmation).&quot; },\n  &quot;previewScreen&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;live&quot;, &quot;options&quot;: [&quot;live&quot;, &quot;intro&quot;, &quot;accepts_card_payments&quot;, &quot;payment_methods&quot;, &quot;processor&quot;, &quot;monthly_volume&quot;, &quot;knows_fees&quot;, &quot;knows_fees_yes&quot;, &quot;interested_in_switching&quot;, &quot;interested_in_future&quot;, &quot;email&quot;, &quot;contact_me&quot;, &quot;contact_me_yes&quot;, &quot;contact_me_agreed&quot;, &quot;done&quot;, &quot;done_contact&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Preview&quot;, &quot;description&quot;: &quot;Jump to a screen for review. live = normal behaviour.&quot; }\n}\">\n// Single source of truth for the Payments survey: questions, answer options,\n// response fields (CSV columns) and the CSV helpers shared by the survey and\n// the results dashboard. Edit questions here and both pages follow.\n\nconst INCENTIVE = '£10 Amazon gift card (first 200 responses)';\nconst STORAGE_KEY = 'payments-survey-responses';\nconst MULTI_SEP = '; ';\n\n// branch: 'all' = every respondent, 'yes'/'no' = only those who answered Q1 Yes/No.\n// after: 'email' puts the question after the email step.\n// consent: explicit tick box shown when the answer equals `when`; required to continue.\n//   This is the GDPR record for sharing a respondent's data with a third party (Lopay).\nconst QUESTIONS = [\n  { id: 'accepts_card_payments', branch: 'all',\n    title: 'Do you currently accept card payments from customers?',\n    options: ['Yes', 'No'] },\n  { id: 'payment_methods', branch: 'yes', multi: true,\n    title: 'How do you currently accept payments?',\n    subtitle: 'Select all that apply.',\n    options: ['In person — card terminal', 'In person — Tap to Pay on a phone', 'In person — payment link',\n      'Online / remotely — payment link', 'Online — through my website', 'Other'] },\n  { id: 'processor', branch: 'yes', layout: 'grid',\n    title: 'Who do you currently use to process your card payments?',\n    options: ['Stripe', 'Square', 'SumUp', 'Zettle', 'Worldpay', 'Barclaycard', 'Dojo', 'Global Payments',\n      'Elavon', 'PayPal', 'Adyen', 'Revolut', 'Lopay', 'Other', 'Not sure'] },\n  { id: 'monthly_volume', branch: 'yes',\n    title: 'Approximately how much do you process in card payments each month?',\n    options: ['Under £2,500', '£2,500–£5,000', '£5,000–£10,000', '£10,000–£25,000', '£25,000–£50,000', '£50,000+'] },\n  { id: 'knows_fees', branch: 'yes',\n    title: 'Do you know approximately how much you currently pay in payment processing fees?',\n    options: ['Yes', 'No', 'Not sure'],\n    followUp: { id: 'current_fees', when: 'Yes', label: 'What do you currently pay?',\n      hint: 'optional — an estimate is fine', placeholder: 'e.g. 1.5%, 1.2% + 10p, around £300 a month' } },\n  { id: 'interested_in_switching', branch: 'yes',\n    title: 'If we could reduce your current payment processing costs, would you be interested in switching?',\n    subtitle: 'Radius is exploring offering payment processing, with rates from as low as 0.79%.',\n    options: ['Yes', 'Maybe — I’d like to see how much I could save', 'No'] },\n  { id: 'interested_in_future', branch: 'no',\n    title: 'Would you be interested in accepting card payments through Radius in the future?',\n    options: ['Yes', 'Maybe', 'No'] },\n  { id: 'contact_me', branch: 'all', after: 'email',\n    title: 'Would you like a call about card payments?',\n    subtitle: 'If you say yes, our payments partner, Lopay, will call you.',\n    options: ['Yes', 'No'],\n    consent: { id: 'lopay_consent', when: 'Yes', column: 'Consented to Lopay contact',\n      label: 'I understand and agree that Radius will share my contact details and survey answers with Lopay, who will contact me about card payments.' } },\n];\n\nfunction questionById(id) { return QUESTIONS.find(q => q.id === id) || null; }\n\n// Ordered step ids for a respondent, given their Q1 answer (defaults to the Yes path).\nfunction pathFor(accepts) {\n  const branch = accepts === 'No' ? 'no' : 'yes';\n  const fits = q => q.branch === 'all' || q.branch === branch;\n  const before = QUESTIONS.filter(q => !q.after && fits(q)).map(q => q.id);\n  const after = QUESTIONS.filter(q => q.after === 'email' && fits(q)).map(q => q.id);\n  return [...before, 'email', ...after];\n}\n\n// CSV columns, in order. key = payload field name, label = human header.\nconst FIELDS = (() => {\n  const f = [\n    { key: 'submitted_at', label: 'Submitted at' },\n    { key: 'segment', label: 'Segment' },\n    { key: 'respondent_id', label: 'Respondent ID' },\n  ];\n  for (const q of QUESTIONS) {\n    f.push({ key: q.id, label: q.title });\n    if (q.followUp) f.push({ key: q.followUp.id, label: q.followUp.label });\n    if (q.consent) f.push({ key: q.consent.id, label: q.consent.column });\n  }\n  f.push({ key: 'email', label: 'Email address' });\n  return f;\n})();\n\nconst norm = s => String(s || '').trim().toLowerCase();\nconst headerToKey = (() => {\n  const m = new Map();\n  for (const f of FIELDS) { m.set(norm(f.key), f.key); m.set(norm(f.label), f.key); }\n  return h => m.get(norm(h)) || String(h || '').trim();\n})();\n\nfunction parseCsv(text) {\n  const rows = []; let row = [], cell = '', q = false;\n  const src = String(text || '').replace(/^\\uFEFF/, '');\n  for (let i = 0; i < src.length; i++) {\n    const c = src[i];\n    if (q) {\n      if (c === '\"') { if (src[i + 1] === '\"') { cell += '\"'; i++; } else q = false; }\n      else cell += c;\n    } else if (c === '\"') q = true;\n    else if (c === ',') { row.push(cell); cell = ''; }\n    else if (c === '\\n' || c === '\\r') {\n      if (c === '\\r' && src[i + 1] === '\\n') i++;\n      row.push(cell); rows.push(row); row = []; cell = '';\n    } else cell += c;\n  }\n  if (cell.length || row.length) { row.push(cell); rows.push(row); }\n  const [header, ...body] = rows.filter(r => r.some(v => v.trim() !== ''));\n  if (!header) return [];\n  const keys = header.map(headerToKey);\n  return body.map(r => { const o = {}; keys.forEach((k, i) => { o[k] = (r[i] ?? '').trim(); }); return o; });\n}\n\nfunction toCsv(rows) {\n  const esc = v => { const s = Array.isArray(v) ? v.join(MULTI_SEP) : String(v ?? ''); return /[\",\\n\\r]/.test(s) ? '\"' + s.replace(/\"/g, '\"\"') + '\"' : s; };\n  const lines = [FIELDS.map(f => esc(f.label)).join(',')];\n  for (const r of rows) lines.push(FIELDS.map(f => esc(r[f.key])).join(','));\n  return lines.join('\\r\\n');\n}\n\n// Values of a multi-select answer as an array (handles both stored arrays and CSV strings).\nfunction splitMulti(v) {\n  if (Array.isArray(v)) return v;\n  return String(v || '').split(MULTI_SEP).map(s => s.trim()).filter(Boolean);\n}\n\n// Deterministic demo responses so the dashboard can be reviewed before real data exists.\nfunction demoResponses(n = 56) {\n  let s = 20261013;\n  const rnd = () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };\n  const pick = (opts, weights) => { const tot = weights.reduce((a, b) => a + b, 0); let r = rnd() * tot; for (let i = 0; i < opts.length; i++) { r -= weights[i]; if (r <= 0) return opts[i]; } return opts[opts.length - 1]; };\n  const q = Object.fromEntries(QUESTIONS.map(x => [x.id, x.options]));\n  const fees = ['1.5%', '1.75% + 20p', 'around £300 a month', '1.2% + 10p', '2.5%', 'about £120 a month', '1.69%'];\n  const out = [];\n  for (let i = 0; i < n; i++) {\n    const r = {\n      submitted_at: new Date(Date.UTC(2026, 9, 1 + Math.floor(rnd() * 12), 8 + Math.floor(rnd() * 10), Math.floor(rnd() * 60))).toISOString(),\n      segment: pick(['velos', 'insurance'], [6, 4]), respondent_id: 'R' + String(1001 + i),\n      accepts_card_payments: pick(q.accepts_card_payments, [7, 3]), email: 'respondent' + (i + 1) + '@example.com',\n    };\n    if (r.accepts_card_payments === 'Yes') {\n      const m = q.payment_methods.filter((_, k) => rnd() < [0.7, 0.35, 0.2, 0.3, 0.25, 0.08][k]);\n      r.payment_methods = (m.length ? m : [q.payment_methods[0]]).join(MULTI_SEP);\n      r.processor = pick(q.processor, [4, 3, 5, 3, 4, 3, 3, 1, 1, 3, 1, 1, 2, 2, 2]);\n      r.monthly_volume = pick(q.monthly_volume, [5, 6, 5, 4, 2, 1]);\n      r.knows_fees = pick(q.knows_fees, [4, 3, 3]);\n      r.current_fees = r.knows_fees === 'Yes' && rnd() < 0.8 ? fees[Math.floor(rnd() * fees.length)] : '';\n      r.interested_in_switching = pick(q.interested_in_switching, [4, 5, 2]);\n    } else {\n      r.interested_in_future = pick(q.interested_in_future, [3, 4, 3]);\n    }\n    r.contact_me = pick(q.contact_me, [4, 6]);\n    r.lopay_consent = r.contact_me === 'Yes' ? 'Yes' : '';\n    out.push(r);\n  }\n  return out;\n}\n\nconst SCHEMA = { INCENTIVE, STORAGE_KEY, MULTI_SEP, QUESTIONS, questionById, pathFor, FIELDS, parseCsv, toCsv, splitMulti, demoResponses };\nconst EMAIL_RE = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/;\nconst PILL = { borderRadius: 999, fontSize: 15, padding: '15px 26px', lineHeight: '20px' };\nconst START_PROPS = { style: { ...PILL, fontSize: 17, padding: '17px 36px' } };\nconst BACK_PROPS = { style: { ...PILL } };\nconst NEXT_PROPS = { style: { ...PILL, width: '100%', justifyContent: 'center' } };\n\nclass Component extends DCLogic {\n  state = { screen: 'intro', answers: {}, email: '', emailTouched: false, status: 'idle', submitError: '', loadError: '', schema: null };\n\n  componentDidMount() {\n    const p = new URLSearchParams(location.search);\n    this.meta = {\n      segment: p.get('seg') || p.get('segment') || p.get('source') || '',\n      respondent_id: p.get('id') || p.get('rid') || '',\n      started_at: new Date().toISOString(),\n    };\n    Promise.resolve(SCHEMA)\n      .then(m => this.setState({ schema: m }))\n      .catch(err => { console.error(err); this.setState({ loadError: 'The survey questions failed to load. Please refresh the page and try again.' }); });\n  }\n\n  // Current screen, honouring the previewScreen tweak (forces a branch so the step is reachable).\n  // Compound previews pre-fill answers so conditional UI (follow-up field, consent box) is visible.\n  resolve() {\n    const S = this.state.schema;\n    const preview = this.props.previewScreen || 'live';\n    const PREVIEWS = {\n      knows_fees_yes: ['knows_fees', { knows_fees: 'Yes' }],\n      contact_me_yes: ['contact_me', { contact_me: 'Yes' }],\n      contact_me_agreed: ['contact_me', { contact_me: 'Yes', lopay_consent: 'Yes' }],\n      done_contact: ['done', { contact_me: 'Yes', lopay_consent: 'Yes' }],\n    };\n    let screen = this.state.screen, answers = this.state.answers;\n    if (preview !== 'live') {\n      const pv = PREVIEWS[preview];\n      screen = pv ? pv[0] : preview;\n      if (pv) answers = { ...answers, ...pv[1] };\n      const q = S && S.questionById(screen);\n      if (q && q.branch !== 'all') answers = { ...answers, accepts_card_payments: q.branch === 'no' ? 'No' : 'Yes' };\n    }\n    const path = S ? S.pathFor(answers.accepts_card_payments) : [];\n    return { S, screen, answers, path, idx: path.indexOf(screen) };\n  }\n\n  select(q, label) {\n    this.setState(s => {\n      const cur = s.answers[q.id];\n      let v = label;\n      if (q.multi) { const arr = Array.isArray(cur) ? cur : []; v = arr.includes(label) ? arr.filter(x => x !== label) : [...arr, label]; }\n      const answers = { ...s.answers, [q.id]: v };\n      if (q.consent && v !== q.consent.when) answers[q.consent.id] = ''; // consent only stands with the answer it was given for\n      return { answers, submitError: '' };\n    });\n  }\n\n  toggleConsent(q) {\n    this.setState(s => ({ answers: { ...s.answers, [q.consent.id]: s.answers[q.consent.id] === 'Yes' ? '' : 'Yes' } }));\n  }\n\n  go(screen) { this.setState({ screen, submitError: '' }); window.scrollTo({ top: 0, behavior: 'smooth' }); }\n\n  async submit(answers) {\n    const S = this.state.schema;\n    const email = this.state.email.trim();\n    const payload = { submitted_at: new Date().toISOString(), ...this.meta };\n    for (const f of S.FIELDS) if (!(f.key in payload)) payload[f.key] = Array.isArray(answers[f.key]) ? answers[f.key].join(S.MULTI_SEP) : (answers[f.key] ?? '');\n    payload.email = email;\n    for (const x of S.QUESTIONS) if (x.consent && payload[x.id] !== x.consent.when) payload[x.consent.id] = '';\n    this.setState({ status: 'sending', submitError: '' });\n    const endpoint = (this.props.endpoint || '').trim();\n    try {\n      if (endpoint) {\n        const mode = this.props.endpointMode || 'json';\n        const res = mode === 'no-cors'\n          ? await fetch(endpoint, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(payload) })\n          : await fetch(endpoint, { method: 'POST', headers:
